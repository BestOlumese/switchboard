name: production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false # never cancel a migration halfway

env:
  NODE_VERSION: 22

jobs:
  ci:
    if: github.repository == 'BestOlumese/switchboard'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  migrate:
    if: github.repository == 'BestOlumese/switchboard'
    needs: ci
    runs-on: ubuntu-latest
    # Reads DATABASE_URL_PROD_UNPOOLED from Repository Secrets or the 'production' Environment.
    # Keep "Required reviewers" disabled on 'production' during active development so pushes to
    # main are not paused waiting for manual approval.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify DATABASE_URL_PROD_UNPOOLED secret is configured
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_PROD_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Missing GitHub secret DATABASE_URL_PROD_UNPOOLED in Repository Secrets or the 'production' environment."
            exit 1
          fi
      - name: Migrate Neon main (unpooled)
        run: pnpm db:migrate
        env: { DATABASE_URL_UNPOOLED: "${{ secrets.DATABASE_URL_PROD_UNPOOLED }}" }
